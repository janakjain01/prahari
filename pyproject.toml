[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prahari"
version = "1.0.0"
description = "Flood evacuation decision layer — turns a flood warning into a route."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Team PRAHARI" }]
keywords = ["flood", "evacuation", "disaster-management", "sar", "routing", "sih"]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "networkx>=3.2",
    "pandas>=2.0",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
model = ["torch>=2.1", "scikit-image>=0.22", "scikit-learn>=1.3"]
geo = ["shapely>=2.0", "pyproj>=3.6", "rasterio>=1.3", "geopandas>=1.0", "pyogrio>=0.7", "osmnx>=2.0"]
remote = ["requests>=2.31", "pystac-client>=0.7", "planetary-computer>=1.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "httpx>=0.26"]

[project.scripts]
prahari = "prahari.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prahari = ["delivery/templates/*.j2", "delivery/locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
